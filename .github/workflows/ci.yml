name: CI

on:
  push:
    branches:
      - "pull-request/[0-9]+"
      - main
      - "release-[0-9]*.[0-9]*"
    tags:
      # GitHub tag globs are not regexes. This catches CompileIQ package
      # release-looking tags such as v1.0.0, v1.0.0rc5, and v1.0.0dev1.
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  public-artifact-guard:
    name: Verify public runtime artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: python dev/check_public_artifacts.py

  lint:
    name: Linter Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'poetry.lock'
      - run: pip install poetry
      - run: poetry install --only linter
      - run: ruff check

  typecheck:
    name: Pyright Type Check
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'poetry.lock'
      - run: pip install poetry
      - run: poetry install --with typecheck,tracking,unittest
      - run: make typecheck

  unit-test:
    # Matrix matches `pyproject.toml`'s `python = ">=3.11,<3.15"` and the
    # platforms supported per the run-examples job (Linux x86_64, Windows).
    # fail-fast: false so divergence between Python versions or OSes
    # surfaces all at once rather than one-at-a-time.
    name: Unit tests [py${{ matrix.python }} on ${{ matrix.os }}]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
      GIT_PYTHON_REFRESH: "quiet"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: 'poetry.lock'
      - run: pip install poetry
      - run: poetry install --with unittest,tracking
      - run: pytest tests/unit/ -vvv


  # ── Test stage ───────────────────────────────────────────────────────────────

  integration-test:
    # Run the integration tests against every (OS, Python version)
    # combination this project claims to support: Linux x86_64 + Windows
    # per the run-examples matrix, Python 3.11/3.12/3.13/3.14 per
    # pyproject.toml's `python = ">=3.11,<3.15"`.
    #
    # An env-divergent regression in any one cell is caught at PR time
    # rather than after the fact downstream. fail-fast: false so all
    # cells report regardless of any single failure.
    name: Integration tests (with coverage) [py${{ matrix.python }} on ${{ matrix.os }}]
    runs-on: ${{ matrix.os }}
    needs: [lint, typecheck, unit-test]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Known broken: test_single_objective_min flakiness (gen-0
          # dedup collision, ~24% rate on any Python; Python 3.13's RNG
          # sequence happens to hit the collision more readily).
          # Tracked: https://github.com/NVIDIA/CompileIQ/issues/17
          # Remove this `include` entry + the matching `continue-on-error`
          # gate when issue #17 closes.
          - os: ubuntu-latest
            python: "3.13"
            known_broken: true
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
      GIT_PYTHON_REFRESH: "quiet"
      PYTHONPATH: ${{ github.workspace }}
      # Real-engine tests fail instead of skipping if the native runtime is missing.
      CIQ_REQUIRE_AMBER: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: 'poetry.lock'
      - run: pip install poetry
      - run: poetry install --with unittest,tracking,native-runtime
      - name: Install the checked-in native runtime
        shell: bash
        run: |
          python dev/materialize_native_runtime.py \
            --runtime-directory native-runtime-wheels \
            $(printf -- '--lane-manifest %s ' native-runtime-wheels/native-runtime-manifest-*.json)
      - name: Run tests with coverage
        continue-on-error: ${{ matrix.known_broken || false }}
        run: |
          pytest tests/unit/ -vvv --cov --durations=10
          pytest tests/integration/ -vvv --cov --cov-append --durations=10
          coverage report

  fuzz-test:
    # Fuzz tests run Linux-only on PR. The Windows fuzz cells were
    # the dominant cost on the broadened matrix (~27 min each) and
    # their failure modes are predominantly Hypothesis-driven
    # algorithmic edge cases that surface identically on Linux. The
    # full {Linux, Windows} matrix runs nightly with deeper
    # exploration via .github/workflows/nightly.yml -- see AGENTS.md
    # ("Default max_examples=20; set CIQ_FUZZ_EXAMPLES=100 for
    # thorough runs (nightly CI does this)").
    name: Fuzz tests [py${{ matrix.python }} on ${{ matrix.os }}]
    runs-on: ${{ matrix.os }}
    needs: [lint, typecheck, unit-test]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
      GIT_PYTHON_REFRESH: "quiet"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: 'poetry.lock'
      - run: pip install poetry
      - run: poetry install --with unittest,tracking
      - name: Run fuzz tests
        run: pytest tests/fuzz/ -vvv --durations=10

  run-examples:
    name: Run examples (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [lint, typecheck, unit-test]
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
          - os: ubuntu-24.04-arm
            name: Linux ARM64
          - os: windows-latest
            name: Windows
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'poetry.lock'
      - run: pip install poetry
      - run: poetry install --with native-runtime
      - name: Install the checked-in native runtime
        shell: bash
        run: |
          python dev/materialize_native_runtime.py \
            --runtime-directory native-runtime-wheels \
            $(printf -- '--lane-manifest %s ' native-runtime-wheels/native-runtime-manifest-*.json)
      - name: Run examples
        working-directory: examples
        shell: bash
        run: |
          for python_file in *.py; do
            if [[ "${python_file}" != "ciq_xgboost.py" ]] && \
               [[ "${python_file}" != "mlflow_tracker.py" ]]; then
              echo "${python_file}"
              python "${python_file}"
            fi
          done
      - name: Run XLA-CIQ mock reference example
        shell: bash
        run: |
          python -m pip install -r examples/compilers/xla_ciq_example/requirements-dev.txt
          cd examples/compilers/xla_ciq_example
          PYTHONPATH=src python -m pytest -q
          PYTHONPATH=src python -m xla_ciq.cli --version
      - name: Check XLA-CIQ protobuf binding
        if: matrix.name == 'Linux x86_64'
        working-directory: examples/compilers/xla_ciq_example
        shell: bash
        run: |
          ./scripts/generate_proto.sh
          git diff --exit-code -- src/xla_ciq/xla_ciq_bundle_pb2.py

  validate-binary-ss:
    name: Validate Binary Search Spaces
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test]
    timeout-minutes: 10
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'poetry.lock'
      - run: pip install poetry
      - run: poetry install --with native-runtime
      - name: Install the checked-in native runtime
        shell: bash
        run: |
          python dev/materialize_native_runtime.py \
            --runtime-directory native-runtime-wheels \
            $(printf -- '--lane-manifest %s ' native-runtime-wheels/native-runtime-manifest-*.json)
      - name: Run Binary SS Validation
        working-directory: tests/compiler_ss
        run: python validate_binary.py

  smoke-test-wheel-matrix:
    name: Select smoke test wheel matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        name: Choose platforms for this ref
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os

          linux_x86 = {
              "os": "ubuntu-latest",
              "name": "Linux x86_64",
              "wheel_platform": "manylinux_2_34_x86_64",
              "artifact_name": "compileiq-frontend-wheel-linux-x86_64",
          }
          release_platforms = [
              linux_x86,
              {
                  "os": "ubuntu-24.04-arm",
                  "name": "Linux aarch64",
                  "wheel_platform": "manylinux_2_34_aarch64",
                  "artifact_name": "compileiq-frontend-wheel-linux-aarch64",
              },
              {
                  "os": "windows-latest",
                  "name": "Windows amd64",
                  "wheel_platform": "win_amd64",
                  "artifact_name": "compileiq-frontend-wheel-windows-amd64",
              },
          ]

          ref = os.environ["GITHUB_REF"]
          full_matrix = ref == "refs/heads/main" or ref.startswith("refs/tags/v")
          platforms = release_platforms if full_matrix else [linux_x86]

          print("Selected smoke test wheel platforms:")
          for platform in platforms:
              print(f"- {platform['name']} ({platform['wheel_platform']})")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps({'include': platforms})}\n")
          PY

  build-and-smoke-test-wheel:
    # This is an input artifact, not a publishable 1.1 product wheel. Since the
    # bundled core was removed it is pure Python; the smoke test pairs it with
    # the checked-in native runtime for the runner's platform. Release
    # composition adds the manifested native payload and reruns clean-install
    # acceptance in the native build lane.
    name: Build and smoke test frontend wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [lint, unit-test, smoke-test-wheel-matrix]
    permissions:
      contents: read
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
      GIT_PYTHON_REFRESH: "quiet"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.smoke-test-wheel-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'poetry.lock'
      - run: python -m pip install poetry wheel
      - name: Set version from tag
        if: |
          startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: poetry version "${GITHUB_REF#refs/tags/v}"
      - run: poetry build -f wheel
      - name: Install built wheel
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Install the checked-in native runtime for this platform
        shell: bash
        run: |
          python -m pip install "pymoo>=0.6.1,<0.7" packaging
          python dev/materialize_native_runtime.py \
            --runtime-directory native-runtime-wheels \
            $(printf -- '--lane-manifest %s ' native-runtime-wheels/native-runtime-manifest-*.json)
      - name: Smoke installed wheel
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/.github/scripts/smoke_test_compileiq_wheel.py"
      - name: Smoke encrypted search space through installed wheel
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c 'import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])' \
            "https://github.com/NVIDIA/CompileIQ/releases/download/search-spaces-2026.08.14/ptxas13.4_search_space.bin" \
            "$RUNNER_TEMP/ptxas13.4_search_space.bin"
          python "$GITHUB_WORKSPACE/dev/smoke_test_encrypted_search_space.py" \
            --search-space "$RUNNER_TEMP/ptxas13.4_search_space.bin" \
            --output-dir "$RUNNER_TEMP/encrypted-search-space-smoke" \
            --mode both \
            --samples 4 \
            --pool-size 6 \
            --workers 1 \
            --expected-sha256 9a232adcc36a6451a4a30f3fe1dbfb29c4476b7b324bcec87bc0f5cc30bbf70d \
            --expected-size 13904
      - name: Upload smoke-tested wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.whl
          if-no-files-found: error

  compose-complete-wheels:
    # Composes the 16 publishable wheels (CPython 3.11-3.14 on Linux x86_64,
    # Linux aarch64, Windows AMD64, and macOS arm64) from the one pure-Python
    # frontend wheel and the checked-in native runtime wheels. Composition is
    # wheel editing, so one Linux job does every cell. The output is not
    # publishable until verify-and-test-complete-wheel accepts it on its own
    # platform; see docs/release_composition.md.
    name: Compose complete wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-smoke-test-wheel, complete-wheel-matrix]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          # The last version listed is the default python; pull requests use
          # the others to clean-install each Linux x86_64 wheel below.
          python-version: |
            3.11
            3.13
            3.14
            3.12
      - run: python -m pip install packaging
      - name: Download smoke-tested frontend wheel
        uses: actions/download-artifact@v6
        with:
          name: compileiq-frontend-wheel-linux-x86_64
          path: frontend
      - name: Compose one complete wheel per checked-in runtime cell
        shell: bash
        run: |
          shopt -s nullglob
          frontend=(frontend/compileiq-*-py3-none-any.whl)
          manifests=(native-runtime-wheels/native-runtime-manifest-*.json)
          if [[ "${#frontend[@]}" -ne 1 || "${#manifests[@]}" -ne 16 ]]; then
            echo "::error::expected 1 frontend wheel and 16 runtime manifests, found ${#frontend[@]} and ${#manifests[@]}"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            runtime_tag="${manifest#native-runtime-wheels/native-runtime-manifest-}"
            runtime_tag="${runtime_tag%.json}"
            runtime=(native-runtime-wheels/compileiq_native_runtime-*-"${runtime_tag}".whl)
            if [[ "${#runtime[@]}" -ne 1 ]]; then
              echo "::error::expected one runtime wheel for ${runtime_tag}, found ${#runtime[@]}"
              exit 1
            fi
            python dev/compose_compileiq_wheel.py \
              --frontend-wheel "${frontend[0]}" \
              --runtime-wheel "${runtime[0]}" \
              --lane-manifest "${manifest}" \
              --frontend-from-this-build \
              --output-dir wheelhouse \
              --output-manifest "wheelhouse/composition-manifest-${runtime_tag}.json"
          done
          composed=(wheelhouse/*.whl)
          if [[ "${#composed[@]}" -ne 16 ]]; then
            echo "::error::expected 16 composed wheels, found ${#composed[@]}"
            exit 1
          fi
          ls -l wheelhouse
      # On pull requests, accept the Linux x86_64 wheels here instead of in
      # verify-and-test-complete-wheel, so a PR waits for one runner instead of
      # three. main and release tags run the full per-platform acceptance.
      - name: Verify and clean-install the Linux x86_64 wheels (pull requests)
        if: needs.complete-wheel-matrix.outputs.full != 'true'
        shell: bash
        run: |
          for python in 3.11 3.12 3.13 3.14; do
            abi="cp${python/./}"
            runtime_tag="${abi}-${abi}-linux_x86_64"
            wheel=(wheelhouse/compileiq-*-"${abi}-${abi}"-manylinux_2_34_x86_64.whl)
            if [[ "${#wheel[@]}" -ne 1 ]]; then
              echo "::error::expected one Linux x86_64 wheel for ${abi}, found ${#wheel[@]}"
              exit 1
            fi
            echo "::group::py${python} ${wheel[0]}"
            python dev/verify_complete_wheel.py "${wheel[0]}" \
              --composition-manifest "wheelhouse/composition-manifest-${runtime_tag}.json"
            "python${python}" dev/test_complete_wheel_install.py --wheel "${wheel[0]}"
            echo "::endgroup::"
          done
      # Not a release input on its own: the upload job only takes wheels that
      # verify-and-test-complete-wheel re-uploads after acceptance.
      - name: Upload composed wheels for acceptance
        uses: actions/upload-artifact@v6
        with:
          name: compileiq-composed-wheels-unverified
          path: wheelhouse/
          if-no-files-found: error

  complete-wheel-matrix:
    name: Select complete wheel matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      full: ${{ steps.matrix.outputs.full }}
    steps:
      - id: matrix
        name: Choose complete wheel cells for this ref
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os

          platforms = [
              {
                  "os": "ubuntu-latest",
                  "name": "Linux x86_64",
                  "runtime_platform": "linux_x86_64",
                  "wheel_platform": "manylinux_2_34_x86_64",
              },
              {
                  "os": "ubuntu-24.04-arm",
                  "name": "Linux aarch64",
                  "runtime_platform": "linux_aarch64",
                  "wheel_platform": "manylinux_2_34_aarch64",
              },
              {
                  "os": "windows-latest",
                  "name": "Windows amd64",
                  "runtime_platform": "win_amd64",
                  "wheel_platform": "win_amd64",
              },
              {
                  # The wheels are tagged macosx_15_0_arm64, so pip on an older
                  # macOS runner would reject them.
                  "os": "macos-15",
                  "name": "macOS arm64",
                  "runtime_platform": "macosx_15_0_arm64",
                  "wheel_platform": "macosx_15_0_arm64",
              },
          ]
          cells = []
          for platform in platforms:
              for python in ("3.11", "3.12", "3.13", "3.14"):
                  abi = "cp" + python.replace(".", "")
                  cells.append(
                      {
                          "os": platform["os"],
                          "name": platform["name"],
                          "python": python,
                          "runtime_tag": f"{abi}-{abi}-{platform['runtime_platform']}",
                          "wheel_tag": f"{abi}-{abi}-{platform['wheel_platform']}",
                      }
                  )

          # Pull requests accept the Linux x86_64 cells inside
          # compose-complete-wheels; main and release tags accept all 16 here,
          # which the release upload requires.
          ref = os.environ["GITHUB_REF"]
          full_matrix = ref == "refs/heads/main" or ref.startswith("refs/tags/v")
          if not full_matrix:
              cells = [cell for cell in cells if cell["name"] == "Linux x86_64"]

          print("Selected complete wheel cells:")
          for cell in cells:
              print(f"- py{cell['python']} on {cell['name']} ({cell['wheel_tag']})")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps({'include': cells})}\n")
              output.write(f"full={'true' if full_matrix else 'false'}\n")
          PY

  verify-and-test-complete-wheel:
    # Complete-wheel acceptance runs on each wheel's own platform and Python
    # version. Only wheels that pass are re-uploaded as
    # compileiq-complete-wheel-* artifacts, the sole input to the release upload.
    name: Verify and install complete wheel [py${{ matrix.python }} on ${{ matrix.name }}]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [compose-complete-wheels, complete-wheel-matrix]
    if: needs.complete-wheel-matrix.outputs.full == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.complete-wheel-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install packaging
      - name: Download composed wheels
        uses: actions/download-artifact@v6
        with:
          name: compileiq-composed-wheels-unverified
          path: wheelhouse
      - name: Select this cell's wheel
        shell: bash
        run: |
          shopt -s nullglob
          wheel=(wheelhouse/compileiq-*-${{ matrix.wheel_tag }}.whl)
          if [[ "${#wheel[@]}" -ne 1 ]]; then
            echo "::error::expected one complete wheel for ${{ matrix.wheel_tag }}, found ${#wheel[@]}"
            exit 1
          fi
          mkdir accepted
          cp "${wheel[0]}" accepted/
          echo "COMPLETE_WHEEL=accepted/$(basename "${wheel[0]}")" >> "$GITHUB_ENV"
      - name: Verify complete wheel
        shell: bash
        run: |
          python dev/verify_complete_wheel.py "$COMPLETE_WHEEL" \
            --composition-manifest "wheelhouse/composition-manifest-${{ matrix.runtime_tag }}.json"
      - name: Clean-install test complete wheel
        shell: bash
        run: |
          expected_version=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_version=(--expected-version "$(python -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' "${GITHUB_REF_NAME#v}")")
          fi
          python dev/test_complete_wheel_install.py --wheel "$COMPLETE_WHEEL" "${expected_version[@]}"
      - name: Upload accepted complete wheel
        uses: actions/upload-artifact@v6
        with:
          name: compileiq-complete-wheel-${{ matrix.wheel_tag }}
          path: accepted/*.whl
          if-no-files-found: error

  # This job is a work around to make sure that all the checks have passed before we mark the PR as ready for review.
  # This is needed because GitHub does not allow us to set a condition on the PR to be marked as ready for review based on the status of the checks.
  # The only status check the repository rules require; keep the name "CI Pass".
  # It needs every job directly and always runs, so a failed or cancelled job
  # anywhere fails it instead of leaving it skipped (which GitHub treats as
  # passing). It only reads its dependencies' results, so it runs on the ARM
  # runner, which picks up jobs in seconds.
  ci-pass:
    name: CI Pass
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    needs:
      - public-artifact-guard
      - lint
      - typecheck
      - unit-test
      - integration-test
      - fuzz-test
      - run-examples
      - validate-binary-ss
      - smoke-test-wheel-matrix
      - build-and-smoke-test-wheel
      - compose-complete-wheels
      - complete-wheel-matrix
      - verify-and-test-complete-wheel
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Pull requests accept the Linux x86_64 wheels inside
          # compose-complete-wheels, so the per-platform acceptance job is
          # skipped on purpose there; main and release tags require it.
          ALLOWED_SKIPS: ${{ needs.complete-wheel-matrix.outputs.full != 'true' && 'verify-and-test-complete-wheel' || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS"])
          allowed_skips = set(os.environ["ALLOWED_SKIPS"].split())
          for name, need in sorted(needs.items()):
              print(f"{name}: {need['result']}")
          bad = {
              name: need["result"]
              for name, need in needs.items()
              if need["result"] != "success"
              and not (need["result"] == "skipped" and name in allowed_skips)
          }
          if bad:
              raise SystemExit(f"Not every job succeeded: {bad}")
          PY

  upload-github-release-wheels:
    name: Upload complete wheels to GitHub release
    runs-on: ubuntu-latest
    needs: [ci-pass, verify-and-test-complete-wheel]
    if: |
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # Only wheels that passed complete-wheel acceptance; frontend-only and
      # unverified composed wheels use other artifact names.
      - name: Download accepted complete wheel artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: compileiq-complete-wheel-*
          path: dist
          merge-multiple: true
      - name: Check release wheel assets
        shell: bash
        run: |
          ls -l dist
          shopt -s nullglob
          wheels=(dist/*.whl)
          pure=(dist/*-none-any.whl)
          if [[ "${#wheels[@]}" -ne 16 || "${#pure[@]}" -ne 0 ]]; then
            echo "::error::expected 16 platform wheels and no pure-Python wheels, found ${#wheels[@]} and ${#pure[@]}"
            exit 1
          fi
      # Uploads the accepted complete wheels to the draft GitHub Release for this tag.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.whl
          generate_release_notes: true
          name: "CompileIQ ${{ github.ref_name }}"
          draft: true
